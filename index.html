<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Humanos vs. Máquina</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23070a18'/%3E%3Cpath d='M8 9l18 7-18 7 4-7z' fill='%23ff3cc8'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #070a18; }
</style>
</head>
<body>
<canvas id="game" width="1560" height="720"></canvas>
<script src="src/rng.js"></script>
<script src="src/games/drone.js"></script>
<script src="src/games/race.js"></script>
<script src="src/nn.js"></script>
<script src="src/ga.js"></script>
<script src="src/storage.js"></script>
<script src="src/input.js"></script>
<script src="src/render.js"></script>
<script src="src/cards.js"></script>
<script src="src/main.js"></script>
<script>
  // dimensiona o canvas mantendo a proporção
  (function () {
    const c = document.getElementById('game');
    function fit() {
      const s = Math.min(innerWidth / c.width, innerHeight / c.height);
      c.style.width = c.width * s + 'px';
      c.style.height = c.height * s + 'px';
    }
    addEventListener('resize', fit); fit();
  })();
</script>
</body>
</html>
